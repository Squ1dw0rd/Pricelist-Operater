# PST Full Pricefile 2025 Configuration
supplier_name: "PST"
file_patterns:
  - "*PST*.xlsx"
  - "*pst*.xlsx"

# Column mappings for PST files
column_mappings:
  sku:
    - "for debtor"  # First column appears to contain codes
    - "code"
    - "product code"
    - "part number"
    - "item code"
  product_name:
    - "excel price file"  # Second column contains descriptions
    - "description"
    - "product name"
    - "item description"
  unit_price:
    - "unit price"
    - "list price"
    - "price"
    - "cost"
  supplier_name:
    - "supplier"
    - "vendor"
    - "manufacturer"

# Data transformations
transformations:
  supplier_name:
    default_value: "PST"
  currency:
    default_value: "AUD"

# Validation overrides
validation_overrides:
  price_range_check:
    min_price: 0.01
    max_price: 10000.00

# File processing settings
file_settings:
  header_row: 1
  skip_rows: 0
  encoding: "utf-8"
