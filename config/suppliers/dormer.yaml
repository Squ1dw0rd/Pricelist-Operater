# Dormer 2025 Supplier Configuration
supplier_name: "Dormer"
file_patterns:
  - "*Dormer*.xlsx"
  - "*dormer*.xlsx"

# Column mappings for Dormer files
column_mappings:
  sku:
    - "code"
    - "product code"
    - "part number"
    - "item code"
  product_name:
    - "description"
    - "product name"
    - "short description"
  unit_price:
    - "wts sell"
    - "unit price"
    - "list price"
    - "price"
  supplier_name:
    - "supplier"
    - "vendor"
    - "manufacturer"
  description:
    - "note"
    - "description"
    - "long description"
  unit_of_measure:
    - "gross weight"
    - "uom"
    - "unit"

# Data transformations
transformations:
  supplier_name:
    default_value: "Dormer"
  currency:
    default_value: "AUD"

# Validation overrides
validation_overrides:
  price_range_check:
    min_price: 0.01
    max_price: 50000.00

# File processing settings
file_settings:
  header_row: 1
  skip_rows: 0
  encoding: "utf-8"
